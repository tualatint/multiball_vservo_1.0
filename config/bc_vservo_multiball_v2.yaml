dataset:
  zarr_path:
  - data/vservo_multiball.zarr
  - data/vservo_multiball_dagger.zarr
  horizon: 5
  pad_before: 1
  pad_after: 0
  seed: 42
  val_ratio: 0.05
  max_train_episodes: 1000
shape_meta:
  obs:
    point_cloud:
    - 1024
    - 7
    agent_pos:
    - 14
  action:
  - 4
horizon: 5
n_obs_steps: 2
n_action_steps: 4
obs_as_global_cond: true
policy:
  condition_type: film
  use_down_condition: true
  use_mid_condition: true
  use_up_condition: true
  diffusion_step_embed_dim: 128
  down_dims:
  - 192
  - 384
  - 768
  kernel_size: 5
  n_groups: 8
  encoder_output_dim: 64
  pointnet_type: pointnet
  use_pc_color: true
  pointcloud_encoder_cfg:
    in_channels: 7
    out_channels: 64
    use_layernorm: true
    final_norm: layernorm
  noise_scheduler:
    num_train_timesteps: 100
    beta_start: 0.0001
    beta_end: 0.02
    beta_schedule: squaredcos_cap_v2
    clip_sample: true
    set_alpha_to_one: true
    steps_offset: 0
    prediction_type: sample
  num_inference_steps: 10
optimizer:
  lr: 0.0001
  betas:
  - 0.95
  - 0.999
  eps: 1.0e-08
  weight_decay: 1.0e-06
training:
  device: cuda:0
  seed: 0
  num_epochs: 100
  lr_scheduler: cosine
  lr_warmup_steps: 500
  use_ema: true
  ema:
    update_after_step: 0
    inv_gamma: 1.0
    power: 0.75
    min_value: 0.0
    max_value: 0.9999
  checkpoint_every: 10
  log_every: 10
  steps_per_epoch: 600
dataloader:
  batch_size: 64
  num_workers: 6
output:
  ckpt_dir: runs/bc_vservo_multiball_v2
