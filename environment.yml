# Conda base environment.  The canonical setup path is `bash setup_env.sh`,
# which creates this environment and then installs requirements.txt.
#
# Manual equivalent:
#   conda env create -f environment.yml
#   conda activate vservo
#   python -m pip install -r requirements.txt
name: vservo
channels:
  - conda-forge
dependencies:
  - python=3.8.20
  - pip=24.3.1
  - setuptools=59.5.0
  - wheel=0.45.1
  - libffi=3.5.2
